name: Platform Validation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: platform-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}

jobs:
  backend-platform:
    name: Backend Platform - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run Ruff correctness check
        run: cd apps/api && uv run ruff check . --select E9,F821,F822,F823

      - name: Run pytest suite
        run: cd apps/api && uv run python -m pytest tests/ -v --tb=short

  workspace-platform:
    name: Workspace Platform - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run production builds
        run: pnpm build

      - name: Run desktop unit tests
        run: pnpm --filter @ater/desktop test -- --reporter=verbose

  rust-platform:
    name: Desktop Rust Platform - ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
            target: aarch64-apple-darwin
            sidecar: ater-api-aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            sidecar: ater-api-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            sidecar: ater-api-x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dummy sidecar binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/src-tauri/binaries
          touch "apps/desktop/src-tauri/binaries/${{ matrix.sidecar }}"
          chmod +x "apps/desktop/src-tauri/binaries/${{ matrix.sidecar }}" || true

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Run cargo build --release
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --release

      - name: Run cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -- --nocapture

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: cd apps/desktop && npx playwright install --with-deps chromium

      - name: Run Playwright tests for desktop mocks
        run: pnpm --filter @ater/desktop test:e2e

      - name: Run Playwright tests for admin
        run: pnpm --filter admin test:e2e

      - name: Run Playwright tests for landing page
        run: pnpm --filter landing-page test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-reports
          path: |
            apps/desktop/playwright-report/
            apps/admin/playwright-report/
            apps/landing-page/playwright-report/
          retention-days: 7

  platform-validation-required:
    name: Platform Validation Required
    if: always()
    needs:
      - backend-platform
      - workspace-platform
      - rust-platform
      - e2e-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform gate to pass
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more platform validation jobs failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "All platform validation jobs passed."
