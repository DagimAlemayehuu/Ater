name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo DagimAlemayehuu/Ater_Releases \
            --title "Ater OS ${{ github.ref_name }}" \
            --notes "Official release for Ater OS version ${{ github.ref_name }}." \
            --draft \
            --discussion-category "Announcements" || true

  publish:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: aarch64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libnm-dev libcloudproviders-dev librsvg2-dev build-essential curl wget libssl-dev libayatana-appindicator3-dev libflatpak-dev

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pyinstaller

      - name: Build Python Sidecar (PyInstaller)
        shell: bash
        run: |
          # Set the target filename based on platform and arch
          if [ "${{ matrix.platform }}" == "macos" ]; then
            TARGET="ater-api-${{ matrix.arch }}-apple-darwin"
          elif [ "${{ matrix.platform }}" == "windows" ]; then
            TARGET="ater-api-x86_64-pc-windows-msvc"
          else
            TARGET="ater-api-x86_64-unknown-linux-gnu"
          fi

          echo "Target binary name: $TARGET"

          # Run PyInstaller
          python -m PyInstaller \
            --noconfirm \
            --onefile \
            --clean \
            --name ater-api \
            --collect-all torch \
            --collect-all onnxruntime \
            apps/api/src/api/main.py

          # Create binaries directory in Tauri src
          mkdir -p apps/desktop/src-tauri/binaries/

          # Move and rename the binary from dist/ to the tauri binaries folder
          if [ "${{ matrix.platform }}" == "windows" ]; then
            mv dist/ater-api.exe apps/desktop/src-tauri/binaries/$TARGET.exe
          else
            mv dist/ater-api apps/desktop/src-tauri/binaries/$TARGET
          fi

      - name: Install All Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: ${{ matrix.platform == 'macos' && format('--target {0}', matrix.arch == 'aarch64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Upload Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          # Upload all bundled files (dmg, exe, deb, AppImage, sig)
          # Using --clobber to handle any potential duplicate uploads
          gh release upload ${{ github.ref_name }} \
            --repo DagimAlemayehuu/Ater_Releases \
            --clobber \
            apps/desktop/src-tauri/target/**/release/bundle/**/*

  publish-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release edit ${{ github.ref_name }} \
            --repo DagimAlemayehuu/Ater_Releases \
            --draft=false

  generate-updater-json:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all signatures
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generate update.json
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          node scripts/generate_update_json.js $VERSION
      
      - name: Upload update.json to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: update.json
          repository: DagimAlemayehuu/Ater_Releases
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
