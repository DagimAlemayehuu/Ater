name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: 'DagimAlemayehuu',
              repo: 'Ater_Releases',
              tag_name: 'v0.0.25',
              name: 'Ater v0.0.25',
              body: 'Official release for Ater version v0.0.25.',
              draft: true
            });
            console.log(`Created release: ${release.html_url}`);

  publish:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14    # Silicon (aarch64)
            platform: macos
            arch: aarch64
          - os: windows-latest
            platform: windows
            arch: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}


      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pyinstaller

      - name: Build Python Sidecar (PyInstaller)
        shell: bash
        run: |
          # Set the target filename based on platform and arch
          if [ "${{ matrix.platform }}" == "macos" ]; then
            TARGET="ater-api-${{ matrix.arch }}-apple-darwin"
          elif [ "${{ matrix.platform }}" == "windows" ]; then
            TARGET="ater-api-x86_64-pc-windows-msvc"
          else
            TARGET="ater-api-x86_64-unknown-linux-gnu"
          fi

          echo "Target binary name: $TARGET"

          # Run PyInstaller
          python -m PyInstaller \
            --noconfirm \
            --onefile \
            --clean \
            --name ater-api \
            --collect-all torch \
            --collect-all onnxruntime \
            apps/api/src/api/main.py

          # Create binaries directory in Tauri src
          mkdir -p apps/desktop/src-tauri/binaries/

          # Move and rename the binary from dist/ to the tauri binaries folder
          if [ "${{ matrix.platform }}" == "windows" ]; then
            mv dist/ater-api.exe apps/desktop/src-tauri/binaries/$TARGET.exe
          else
            mv dist/ater-api apps/desktop/src-tauri/binaries/$TARGET
            chmod +x apps/desktop/src-tauri/binaries/$TARGET
          fi

      - name: Ad-hoc Sign Sidecar
        if: matrix.platform == 'macos'
        run: |
          TARGET_BIN="apps/desktop/src-tauri/binaries/ater-api-${{ matrix.arch }}-apple-darwin"
          # The "-" means ad-hoc signing (no identity required)
          codesign --force --deep -s - "$TARGET_BIN"

      - name: Install All Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v0.0.25
          releaseName: "Ater v0.0.25"
          owner: DagimAlemayehuu
          repo: Ater_Releases
          publish: false
          args: ${{ matrix.platform == 'macos' && format('--target {0}', matrix.arch == 'aarch64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Upload to Ater_Releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          # Create the release if it doesn't exist (ignore error if it does)
          gh release create v0.0.25 --repo DagimAlemayehuu/Ater_Releases --title "Ater v0.0.25" --notes "Production Release v0.0.25" || echo "Release already exists"
          
          # Upload the Mac DMG (Silicon)
          if [ "${{ matrix.os }}" == "macos-14" ]; then
            gh release upload v0.0.25 apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg --repo DagimAlemayehuu/Ater_Releases --clobber
          fi
          
          # Upload the Windows Setup
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            gh release upload v0.0.25 apps/desktop/src-tauri/target/release/bundle/nsis/*.exe --repo DagimAlemayehuu/Ater_Releases --clobber
          fi

  publish-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release edit v0.0.25 \
            --repo DagimAlemayehuu/Ater_Releases \
            --discussion-category "Announcements" \
            --draft=false

  generate-updater-json:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all signatures
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generate update.json
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          node scripts/generate_update_json.js $VERSION
      
      - name: Upload update.json to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: DagimAlemayehuu/Ater_Releases
          tag_name: v0.0.25
          files: update.json
