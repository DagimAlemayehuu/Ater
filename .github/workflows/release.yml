name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: aarch64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libnm-dev libcloudproviders-dev librsvg2-dev build-essential curl wget libssl-dev libayatana-appindicator3-dev libflatpak-dev

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install nuitka

      - name: Build Python Sidecar (Nuitka)
        shell: bash
        run: |
          cd apps/api
          # OS-specific target naming for Tauri
          if [ "${{ matrix.platform }}" == "macos" ]; then
            TARGET="api-${{ matrix.arch }}-apple-darwin"
          elif [ "${{ matrix.platform }}" == "windows" ]; then
            TARGET="api-x86_64-pc-windows-msvc"
          else
            TARGET="api-x86_64-unknown-linux-gnu"
          fi
          
          # Run Nuitka
          python -m nuitka \
            --standalone \
            --onefile \
            --remove-output \
            --output-filename=ater-api \
            src/api/main.py
            
          mkdir -p ../desktop/src-tauri/binaries/
          if [ "${{ matrix.platform }}" == "windows" ]; then
            mv ater-api.exe ../desktop/src-tauri/binaries/$TARGET.exe
          else
            mv ater-api ../desktop/src-tauri/binaries/$TARGET
          fi

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action replaces this with the version from tauri.conf.json
          releaseName: "Ater v__VERSION__"
          releaseBody: "Automated release from GitHub Actions."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'macos' && format('--target {0}', matrix.arch == 'aarch64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

  generate-updater-json:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all signatures
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generate update.json
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          node scripts/generate_update_json.js $VERSION
      
      - name: Upload update.json to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
