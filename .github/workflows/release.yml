name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data: release } = await github.rest.repos.createRelease({
              owner: 'DagimAlemayehuu',
              repo: 'Ater_Releases',
              tag_name: tag,
              name: `Ater ${tag}`,
              body: `Official release for Ater ${tag}.`,
              draft: true
            });
            console.log(`Created release: ${release.html_url}`);

  publish:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14    # Silicon (aarch64)
            platform: macos
            arch: aarch64
          - os: windows-latest
            platform: windows
            arch: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pyinstaller

      - name: Build Python Sidecar (PyInstaller)
        shell: bash
        run: |
          # Determine the Tauri-expected binary name for this platform/arch
          if [ "${{ matrix.platform }}" == "macos" ]; then
            TARGET="ater-api-${{ matrix.arch }}-apple-darwin"
          elif [ "${{ matrix.platform }}" == "windows" ]; then
            TARGET="ater-api-x86_64-pc-windows-msvc"
          else
            TARGET="ater-api-x86_64-unknown-linux-gnu"
          fi

          echo "Building binary: $TARGET"

          # KEY FIX: We intentionally do NOT use --collect-all torch or --collect-all onnxruntime.
          # Those flags bundle 1.5-3GB of data that PyInstaller --onefile extracts to a temp
          # directory on EVERY cold start — causing a 2-5 minute delay before the API binds,
          # which triggers "Engine Failure" in the frontend SidecarGate.
          #
          # PyInstaller still collects torch/onnxruntime through normal import tracing.
          # We only use --collect-all for packages that have non-Python data files
          # (tokenizer configs, ONNX models, etc.) that tracing would miss.
          python -m PyInstaller \
            --noconfirm \
            --onefile \
            --clean \
            --name ater-api \
            --paths apps/api \
            --hidden-import uvicorn.protocols.http.httptools_impl \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import aiosqlite \
            --hidden-import greenlet \
            apps/api/src/api/main.py

          # Create binaries directory
          mkdir -p apps/desktop/src-tauri/binaries/

          # Move and rename to match Tauri's externalBin naming convention
          if [ "${{ matrix.platform }}" == "windows" ]; then
            mv dist/ater-api.exe apps/desktop/src-tauri/binaries/$TARGET.exe
          else
            mv dist/ater-api apps/desktop/src-tauri/binaries/$TARGET
            chmod +x apps/desktop/src-tauri/binaries/$TARGET
          fi

          echo "Binary ready at: apps/desktop/src-tauri/binaries/$TARGET"

      - name: Ad-hoc Sign Sidecar (macOS)
        if: matrix.platform == 'macos'
        run: |
          TARGET_BIN="apps/desktop/src-tauri/binaries/ater-api-${{ matrix.arch }}-apple-darwin"
          # Ad-hoc sign with "-" (no Developer ID required).
          # Users bypass Gatekeeper manually on first launch for early access.
          codesign --force --deep -s - "$TARGET_BIN"
          echo "Sidecar signed (ad-hoc)."

      - name: Install All Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          publish: false
          args: ${{ matrix.platform == 'macos' && format('--target {0}', matrix.arch == 'aarch64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Upload Artifacts to Release Repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          # Ensure the release exists (idempotent — OK if another runner already created it)
          gh release create "$TAG" \
            --repo DagimAlemayehuu/Ater_Releases \
            --title "Ater $TAG" \
            --notes "Production Build $TAG" \
            || echo "Release already exists — skipping create."

          if [ "${{ matrix.platform }}" == "macos" ]; then
            # DMG Upload
            DMG_PATH=$(find apps/desktop/src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/dmg/ -name "*.dmg" | head -n 1)
            echo "Uploading DMG: $DMG_PATH"
            gh release upload "$TAG" "$DMG_PATH" --repo DagimAlemayehuu/Ater_Releases --clobber
            
            # Alias copy
            cp "$DMG_PATH" apps/desktop/src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/dmg/Ater-${{ matrix.arch }}.dmg
            gh release upload "$TAG" apps/desktop/src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/dmg/Ater-${{ matrix.arch }}.dmg --repo DagimAlemayehuu/Ater_Releases --clobber

            # Updater Tarball and Signature Upload
            TAR_PATH=$(find apps/desktop/src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/ -name "*.app.tar.gz" | head -n 1)
            SIG_PATH=$(find apps/desktop/src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/ -name "*.app.tar.gz.sig" | head -n 1 || echo "")
            echo "Uploading Tarball: $TAR_PATH"
            gh release upload "$TAG" "$TAR_PATH" --repo DagimAlemayehuu/Ater_Releases --clobber
            if [ -n "$SIG_PATH" ]; then
              gh release upload "$TAG" "$SIG_PATH" --repo DagimAlemayehuu/Ater_Releases --clobber
            else
              echo "Warning: No .sig file found for macOS. Is TAURI_PRIVATE_KEY set in secrets?"
            fi
          fi

          if [ "${{ matrix.platform }}" == "windows" ]; then
            # EXE Upload
            EXE_PATH=$(find apps/desktop/src-tauri/target/release/bundle/nsis/ -name "*.exe" | head -n 1)
            echo "Uploading EXE: $EXE_PATH"
            gh release upload "$TAG" "$EXE_PATH" --repo DagimAlemayehuu/Ater_Releases --clobber
            
            # Alias copy
            cp "$EXE_PATH" apps/desktop/src-tauri/target/release/bundle/nsis/Ater_setup.exe
            gh release upload "$TAG" apps/desktop/src-tauri/target/release/bundle/nsis/Ater_setup.exe --repo DagimAlemayehuu/Ater_Releases --clobber

            # Updater Zip and Signature Upload
            ZIP_PATH=$(find apps/desktop/src-tauri/target/release/bundle/ -name "*.zip" | head -n 1 || echo "")
            SIG_PATH=$(find apps/desktop/src-tauri/target/release/bundle/ -name "*.zip.sig" | head -n 1 || echo "")
            echo "Uploading Zip: $ZIP_PATH"
            if [ -n "$ZIP_PATH" ]; then
              gh release upload "$TAG" "$ZIP_PATH" --repo DagimAlemayehuu/Ater_Releases --clobber
            else
              echo "Warning: No updater .zip file found for Windows."
            fi
            if [ -n "$SIG_PATH" ]; then
              gh release upload "$TAG" "$SIG_PATH" --repo DagimAlemayehuu/Ater_Releases --clobber
            else
              echo "Warning: No .sig file found for Windows. Is TAURI_PRIVATE_KEY set in secrets?"
            fi
          fi

      - name: Upload signatures as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signatures-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/src-tauri/target/**/*.sig

  publish-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Make Release Public
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$TAG" \
            --repo DagimAlemayehuu/Ater_Releases \
            --discussion-category "Announcements" \
            --draft=false

  generate-updater-json:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact signatures
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate update.json
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          node scripts/generate_update_json.js $VERSION

      - name: Upload update.json to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: DagimAlemayehuu/Ater_Releases
          tag_name: ${{ github.ref_name }}
          files: update.json
