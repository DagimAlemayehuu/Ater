name: "Release"

on:
  push:
    tags:
      - 'v*'

env:
  RELEASE_REPOSITORY: "DagimAlemayehuu/Ater_Releases"

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Tag matches all version files
        run: |
          CONF_VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          TAG_VERSION=${{ github.ref_name }}
          TAG_VERSION=${TAG_VERSION#v}
          
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! tauri.conf.json ($CONF_VERSION) vs tag ($TAG_VERSION)"
            exit 1
          fi
          
          CARGO_VERSION=$(grep '^version' apps/desktop/src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/' | tr -d ' ')
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Cargo.toml ($CARGO_VERSION) vs tag ($TAG_VERSION)"
            exit 1
          fi
          
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! package.json ($PKG_VERSION) vs tag ($TAG_VERSION)"
            exit 1
          fi
          
          echo "✅ All version files match tag $TAG_VERSION"

      - name: Create Draft Release
        uses: actions/github-script@v7
        env:
          RELEASE_REPOSITORY: ${{ env.RELEASE_REPOSITORY }}
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const [owner, repo] = process.env.RELEASE_REPOSITORY.split('/');
            try {
              const { data: release } = await github.rest.repos.createRelease({
                owner: owner,
                repo: repo,
                tag_name: tag,
                name: `Ater ${tag}`,
                body: `## Ater ${tag}\n\n**System Requirements**\n- macOS: Apple Silicon (M1/M2/M3) — Intel Macs not supported\n- Windows: x64\n- Linux: x64 AppImage or deb\n\nOfficial release for Ater ${tag}.`,
                draft: true
              });
              console.log(`Created release: ${release.html_url}`);
            } catch (error) {
              if (error.status !== 422) throw error;
              // getReleaseByTag returns 404 for draft releases. List releases to safely find an existing draft.
              const { data: releases } = await github.rest.repos.listReleases({
                owner: owner,
                repo: repo
              });
              const release = releases.find(r => r.tag_name === tag);
              if (release) {
                console.log(`Release draft already exists: ${release.html_url}`);
              } else {
                throw error;
              }
            }


  publish:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14    # Silicon (aarch64)
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
            sidecar: ater-api-aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - os: windows-latest
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            sidecar: ater-api-x86_64-pc-windows-msvc.exe
            tauri_args: ""
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            sidecar: ater-api-x86_64-unknown-linux-gnu
            tauri_args: --bundles appimage,deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pyinstaller

      - name: Build Python Sidecar (PyInstaller)
        shell: bash
        run: |
          TARGET="${{ matrix.sidecar }}"

          echo "Building binary: $TARGET"

          # KEY FIX: We intentionally do NOT use --collect-all torch or --collect-all onnxruntime.
          # Those flags bundle 1.5-3GB of data that PyInstaller --onefile extracts to a temp
          # directory on EVERY cold start — causing a 2-5 minute delay before the API binds,
          # which triggers "Engine Failure" in the frontend SidecarGate.
          #
          # PyInstaller still collects torch/onnxruntime through normal import tracing.
          # We only use --collect-all for packages that have non-Python data files
          # (tokenizer configs, ONNX models, etc.) that tracing would miss.
          python -m PyInstaller \
            --noconfirm \
            --clean \
            apps/api/ater-api.spec

          # Ensure binaries directory exists
          mkdir -p apps/desktop/src-tauri/binaries

          # Move and rename to match Tauri's externalBin naming convention
          if [ "${{ matrix.platform }}" == "windows" ]; then
            mv dist/ater-api.exe apps/desktop/src-tauri/binaries/$TARGET
          else
            mv dist/ater-api apps/desktop/src-tauri/binaries/$TARGET
            chmod +x apps/desktop/src-tauri/binaries/$TARGET
          fi

          echo "Binary ready at: apps/desktop/src-tauri/binaries/$TARGET"

      - name: Ad-hoc Sign Sidecar (macOS)
        if: matrix.platform == 'macos'
        run: |
          TARGET_BIN="apps/desktop/src-tauri/binaries/ater-api-${{ matrix.arch }}-apple-darwin"
          # Ad-hoc sign with "-" (no Developer ID required).
          # Users bypass Gatekeeper manually on first launch for early access.
          codesign --force --deep -s - "$TARGET_BIN"
          echo "Sidecar signed (ad-hoc)."

      - name: Verify Sidecar Binary Health
        shell: bash
        run: |
          set -euo pipefail
          SIDECAR="apps/desktop/src-tauri/binaries/${{ matrix.sidecar }}"
          test -f "$SIDECAR"
          "$SIDECAR" --health-check

      - name: Verify Release Resources
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/api/onnx_model
          test -f Ater.md
          test -d .system/prompts
          test -s "apps/desktop/src-tauri/binaries/${{ matrix.sidecar }}"



      - name: Install All Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Tauri updater signing inputs
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          publish: false
          args: ${{ matrix.tauri_args }}

      - name: Verify Packaged Bundle Outputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos" ]; then
            test -n "$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name '*.dmg' -print -quit)"
            test -n "$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name '*.app.tar.gz' -print -quit)"
            test -n "$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            test -n "$(find apps/desktop/src-tauri/target/release/bundle -name '*.exe' -print -quit)"
            test -n "$(find apps/desktop/src-tauri/target/release/bundle -name '*.zip' -print -quit)"
            test -n "$(find apps/desktop/src-tauri/target/release/bundle -name '*.zip.sig' -print -quit)"
          else
            test -n "$(find apps/desktop/src-tauri/target/release/bundle -name '*.AppImage' -print -quit)"
            test -n "$(find apps/desktop/src-tauri/target/release/bundle -name '*.deb' -print -quit)"
            test -n "$(find apps/desktop/src-tauri/target/release/bundle -name '*.AppImage.tar.gz' -print -quit)"
            test -n "$(find apps/desktop/src-tauri/target/release/bundle -name '*.AppImage.tar.gz.sig' -print -quit)"
          fi

      - name: Upload Artifacts to Release Repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The draft release was created by the create-release job.
          # We only need to push the tag and upload artifacts here.
          # Removed: duplicate `gh release create` that caused a race condition
          # when both macOS and Windows runners tried to create the same release simultaneously.

          if [ "${{ matrix.platform }}" == "macos" ]; then
            DMG_PATH=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/ -name "*.dmg" | head -n 1 || echo "")
            if [ -f "$DMG_PATH" ]; then
              echo "Uploading DMG: $DMG_PATH"
              gh release upload "$TAG" "$DMG_PATH" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
              cp "$DMG_PATH" "Ater-${{ matrix.arch }}.dmg"
              gh release upload "$TAG" "Ater-${{ matrix.arch }}.dmg" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
            fi

            TAR_PATH=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/ -name "*.app.tar.gz" | head -n 1 || echo "")
            if [ -f "$TAR_PATH" ]; then
              # Force versioned name for updater
              VERSION_TAR="Ater_${TAG#v}_${{ matrix.arch }}.app.tar.gz"
              cp "$TAR_PATH" "$VERSION_TAR"
              echo "Uploading versioned TAR: $VERSION_TAR"
              gh release upload "$TAG" "$VERSION_TAR" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
            fi
            
            SIG_PATH=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/ -name "*.app.tar.gz.sig" | head -n 1 || echo "")
            if [ -f "$SIG_PATH" ]; then
              gh release upload "$TAG" "$SIG_PATH" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
            fi
          fi

          if [ "${{ matrix.platform }}" == "windows" ]; then
            EXE_PATH=$(find apps/desktop/src-tauri/target/release/bundle/nsis/ -name "*.exe" | head -n 1 || echo "")
            if [ -f "$EXE_PATH" ]; then
              echo "Uploading EXE: $EXE_PATH"
              gh release upload "$TAG" "$EXE_PATH" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
              cp "$EXE_PATH" "Ater_setup.exe"
              gh release upload "$TAG" "Ater_setup.exe" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
            fi

            ZIP_PATH=$(find apps/desktop/src-tauri/target/release/bundle/nsis/ -name "*.zip" | head -n 1 || echo "")
            if [ -f "$ZIP_PATH" ]; then
              # Force versioned name for updater
              VERSION_ZIP="Ater_${TAG#v}_x64-setup.nsis.zip"
              cp "$ZIP_PATH" "$VERSION_ZIP"
              echo "Uploading versioned ZIP: $VERSION_ZIP"
              gh release upload "$TAG" "$VERSION_ZIP" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
            fi

            SIG_PATH=$(find apps/desktop/src-tauri/target/release/bundle/nsis/ -name "*.zip.sig" | head -n 1 || echo "")
            if [ -f "$SIG_PATH" ]; then
              gh release upload "$TAG" "$SIG_PATH" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
            fi
          fi

          if [ "${{ matrix.platform }}" == "linux" ]; then
            APPIMAGE_PATH=$(find apps/desktop/src-tauri/target/release/bundle/appimage/ -name "*.AppImage" | head -n 1 || echo "")
            if [ -f "$APPIMAGE_PATH" ]; then
              echo "Uploading AppImage: $APPIMAGE_PATH"
              gh release upload "$TAG" "$APPIMAGE_PATH" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
              cp "$APPIMAGE_PATH" "Ater_x86_64.AppImage"
              gh release upload "$TAG" "Ater_x86_64.AppImage" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
            fi

            DEB_PATH=$(find apps/desktop/src-tauri/target/release/bundle/deb/ -name "*.deb" | head -n 1 || echo "")
            if [ -f "$DEB_PATH" ]; then
              echo "Uploading deb: $DEB_PATH"
              gh release upload "$TAG" "$DEB_PATH" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
              cp "$DEB_PATH" "Ater_${TAG#v}_amd64.deb"
              gh release upload "$TAG" "Ater_${TAG#v}_amd64.deb" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
            fi

            TAR_PATH=$(find apps/desktop/src-tauri/target/release/bundle/appimage/ -name "*.AppImage.tar.gz" | head -n 1 || echo "")
            if [ -f "$TAR_PATH" ]; then
              VERSION_TAR="Ater_${TAG#v}_x86_64.AppImage.tar.gz"
              cp "$TAR_PATH" "$VERSION_TAR"
              echo "Uploading versioned AppImage TAR: $VERSION_TAR"
              gh release upload "$TAG" "$VERSION_TAR" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
            fi

            SIG_PATH=$(find apps/desktop/src-tauri/target/release/bundle/appimage/ -name "*.AppImage.tar.gz.sig" | head -n 1 || echo "")
            if [ -f "$SIG_PATH" ]; then
              gh release upload "$TAG" "$SIG_PATH" --repo "${{ env.RELEASE_REPOSITORY }}" --clobber
            fi
          fi

      - name: Upload signatures as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signatures-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/src-tauri/target/**/*.sig

  publish-release:
    needs: generate-updater-json
    runs-on: ubuntu-latest
    steps:
      - name: Make Release Public
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$TAG" \
            --repo "${{ env.RELEASE_REPOSITORY }}" \
            --draft=false

  generate-updater-json:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact signatures
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate update.json
        env:
          GITHUB_REPOSITORY: ${{ env.RELEASE_REPOSITORY }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json
          node scripts/generate_update_json.js $VERSION --assets release-assets.json

      - name: Upload update.json to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: ${{ env.RELEASE_REPOSITORY }}
          tag_name: ${{ github.ref_name }}
          files: update.json
