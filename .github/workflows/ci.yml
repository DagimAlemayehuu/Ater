name: Gatekeeper CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches-ignore: [ "main" ]
  workflow_dispatch:

concurrency:
  group: gatekeeper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_key' }}

jobs:
  workflow-contracts:
    name: Workflow Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow YAML parses
        run: |
          ruby -e "require 'yaml'; Dir['.github/workflows/*.yml'].each { |f| YAML.load_file(f); puts \"parsed #{f}\" }"

      - name: Run release and CI contract tests
        run: |
          node --test \
            scripts/ci_workflow_contract.test.js \
            scripts/generate_update_json.test.js \
            scripts/release_workflow_contract.test.js

  backend-smoke:
    name: Backend Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run Ruff correctness check
        run: cd apps/api && uv run ruff check . --select E9,F821,F822,F823

      - name: Run pytest suite
        run: cd apps/api && uv run python -m pytest tests/ -v --tb=short

  workspace-js:
    name: Workspace JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run production builds
        run: pnpm build

      - name: Run desktop unit tests
        run: pnpm --filter @ater/desktop test -- --reporter=verbose

  rust-check:
    name: Desktop Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dummy sidecar binary
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          touch apps/desktop/src-tauri/binaries/ater-api-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/ater-api-x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Run cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  gatekeeper-required:
    name: Gatekeeper Required
    if: always()
    needs:
      - workflow-contracts
      - backend-smoke
      - workspace-js
      - rust-check
    runs-on: ubuntu-latest
    steps:
      - name: Require every fast gate to pass
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required Gatekeeper CI jobs failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "All required Gatekeeper CI jobs passed."
