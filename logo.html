<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      width: 100vw;
      background-color: #fcf8f2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    .brand-logo {
      display: flex;
      align-items: baseline;
      gap: 1.25rem;
      line-height: 1;
    }
    .brand-en {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 900;
      font-size: clamp(3rem, 10vw, 7rem);
      letter-spacing: -0.04em;
      color: #18181b;
    }
    .brand-am {
      font-family: "Noto Sans Ethiopic", "Kefa", "Nyala", sans-serif;
      font-weight: 900;
      font-size: clamp(3rem, 10vw, 7rem);
      color: rgba(24, 24, 27, 0.45);
    }
  </style>
</head>
<body>
  <div class="brand-logo">
    <span class="brand-en">ATER</span>
    <span class="brand-am">አጠር</span>
  </div>
</body>
</html>
