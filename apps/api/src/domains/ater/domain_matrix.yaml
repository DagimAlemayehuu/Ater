      derivation.
  ECON-MICRO:
    persona: Microeconomist
    h1: How the Economics Actually Work
    h2: The Formal Math & Models
    artifact: Data Schedule & Visualization
    type: 'Markdown Table (Demand/Supply Schedule) OR ASCII Text Graph. Do NOT use
      Mermaid flowcharts for plotting economic curves. Use a well-formatted Markdown
      Table showing Price and Quantity, accompanied by a LaTeX block explaining the
      coordinate shift, or a clear ASCII representation of a Cartesian graph. Discipline
      Prohibition: DO NOT generate Python, R, or any programming code. Mathematical
      artifacts must be pure LaTeX or Markdown tables.'
    question_modes:
    - mcq
    - fill_in
    - trace
    - true_false
    sanity_check: "Microeconomic Axioms: \n1. ONLY Marginal/Variable costs shift the\
      \ short-run supply curve. Fixed costs DO NOT shift supply.\n2. Do not conflate\
      \ Macroeconomic Aggregate Demand with Microeconomic Market Clearing. If supply\
      \ shifts, price falls until the market clears.\n3. Clearly distinguish between\
      \ 'a shift in the curve' and 'a movement along the curve'. NEVER use a curve\
      \ shifter (like Technology, Weather, or Income) to explain a price-induced movement\
      \ ALONG the curve (like Law of Demand or Law of Supply).\n4. Never refer to\
      \ the price BEFORE a shift as the 'equilibrium price' AFTER the shift.\n5. SUPPLY\
      \ ELASTICITY AXIOM: To calculate Price Elasticity of Supply (Es), you MUST use\
      \ a scenario where DEMAND shifts, causing movement along the supply curve. NEVER\
      \ use a scenario where supply shifts (like a drought) to calculate Es, as this\
      \ yields a negative number which violates the Law of Supply.\n6. SHIFTS vs.\
      \ MOVEMENTS AXIOM: If the concept is a curve SHIFTER (e.g., Income, Technology,\
      \ Number of Buyers), your Artifact and Walkthrough MUST feature TWO distinct\
      \ equations (e.g., D1 and D2) to prove the curve shifted horizontally at a CONSTANT\
      \ price. You are STRICTLY FORBIDDEN from demonstrating a shifter by plugging\
      \ different prices into a single, stationary equation.\n7. AGGREGATION AXIOM:\
      \ NEVER equate 'quantity demanded' with 'number of buyers'. They are distinct\
      \ concepts. Always use standard 'Horizontal Summation' (Qd_market = Qd1 + Qd2)\
      \ to demonstrate the addition of buyers. DO NOT invent or use obscure academic\
      \ axioms (e.g., 'Aggregation Axiom') not present in the source text.\n8. INCOME\
      \ COEFFICIENTS AXIOM: If a good is NORMAL, the income variable (I) in the demand\
      \ function MUST be positive (e.g., + 0.5I). If a good is INFERIOR, the income\
      \ variable (I) MUST be negative (e.g., - 0.5I).\n9. PEDAGOGICAL ALIGNMENT AXIOM:\
      \ The Artifact, Walkthrough, and Q3 Trace MUST align with the epistemic type\
      \ of the concept. If the topic is 'Determinants' or 'Factors', focus on the\
      \ 'Why' (cascading logic). If the topic is 'Equilibrium' or 'Elasticity Calculation',\
      \ focus on the 'How' (math). DO NOT use rote math to teach purely conceptual\
      \ determinants.\n10. TERMINOLOGY FIDELITY AXIOM: Strictly adhere to the terminology\
      \ in the SOURCE CONTEXT. Do not use high-level PhD-level terms if the text uses\
      \ introductory language."
    l3_law: L3 MUST be a multi-step analytical application. IF the topic is calculative
      (e.g., Equilibrium, Elasticity calculation), use a math derivation. IF the topic
      is conceptual (e.g., Determinants, Barriers to Entry), use a 'System Perturbation
      Trace' (cascading logic) where the user determines a qualitative outcome based
      on changing factors.
