[project]
name = "ater-api"
version = "0.1.0"
description = "Ater Python FastAPI Sidecar - AI, Notion, and Obsidian logic layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "markdown2>=2.5.4",
    "beautifulsoup4>=4.14.3",
    "google-genai>=1.0.0",
    "aiosqlite>=0.22.1",
    "sqlalchemy>=2.0.46",
    "google-generativeai>=0.8.6",
    "loguru>=0.7.3",
    "python-multipart>=0.0.22",
    "python-frontmatter>=1.1.0",
    "greenlet>=3.3.2",
    "watchdog>=4.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.3.0",
    "langchain-groq>=0.2.0",
    "chromadb>=1.5.5",
    "sentence-transformers>=5.3.0",
    "langchain-huggingface>=1.2.1",
    "langchain-community>=0.3.0",
    "pypdf>=5.1.0",
    "ruamel-yaml>=0.19.1",
    "langchain-core>=0.3.0",
]

[project.scripts]
start = "src.api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.15.11",
    "pytest-asyncio>=1.3.0",
]
