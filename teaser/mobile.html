<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ater — Teaser (TikTok / Reels 9:16)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Noto+Sans+Ethiopic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0c0d0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e5e5e5;
      overflow: hidden;
      padding: 20px 0;
    }
    #stage-wrapper {
      position: relative;
      width: 405px;
      height: 720px;
      max-height: 84vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      overflow: hidden;
      background: #fcf8f2;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 18px;
      border-radius: 40px;
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    button {
      background: #dfd8cb;
      color: #18181b;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }
    button:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }
    .timeline {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
      font-variant-numeric: tabular-nums;
    }
    input[type=range] {
      width: 160px;
      accent-color: rgba(24, 24, 27, 0.6);
      cursor: pointer;
    }

    /* Instagram Story Style 30s Audio Section Picker */
    .audio-picker-card {
      margin-top: 10px;
      width: 405px;
      max-width: 95vw;
      background: #f7f1e7;
      border: 1px solid rgba(24, 24, 27, 0.08);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03);
    }
    .picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .song-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .song-dropdown {
      background: #ebe3d5;
      color: #18181b;
      border: 1px solid rgba(24, 24, 27, 0.12);
      padding: 5px 10px;
      border-radius: 18px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      outline: none;
      max-width: 170px;
    }
    .picker-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #555;
    }
    .pill-btn {
      padding: 4px 10px;
      font-size: 11px;
      background: #18181b;
      color: #fbf7f0;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      font-weight: 600;
    }
    .waveform-container {
      position: relative;
      height: 48px;
      background: #eee6d8;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0 6px;
      touch-action: none;
    }
    .waveform-bars {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      pointer-events: none;
      gap: 2px;
    }
    .bar {
      flex: 1;
      background: rgba(24, 24, 27, 0.22);
      border-radius: 2px;
      min-height: 3px;
    }
    .selection-window {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(24, 24, 27, 0.12);
      border: 2px solid #18181b;
      border-radius: 6px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      user-select: none;
      z-index: 10;
    }
    .selection-window:active {
      cursor: grabbing;
    }
    .window-handle {
      width: 3px;
      height: 18px;
      background: #18181b;
      border-radius: 1px;
    }
    .window-time {
      font-size: 10px;
      font-weight: 700;
      color: #18181b;
      background: rgba(255, 255, 255, 0.9);
      padding: 1px 6px;
      border-radius: 8px;
      pointer-events: none;
    }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #e11d48;
      pointer-events: none;
      z-index: 15;
      display: none;
    }
    .picker-instructions {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #777;
      margin-top: 5px;
      padding: 0 2px;
    }
  </style>
</head>
<body>

  <div id="stage-wrapper">
    <!-- TikTok / Reels 9:16 portrait resolution -->
    <canvas id="canvas" width="1080" height="1920"></canvas>
  </div>

  <div class="controls">
    <button id="playBtn">Pause</button>
    <button id="restartBtn">Replay</button>
    <button id="muteBtn">Sound On</button>
    <button id="switchBtn" style="background:#18181b;color:#fbf7f0;">🖥 Desktop 16:9</button>
    <button id="exportVideoBtn" style="background:#18181b;color:#fbf7f0;font-weight:700;">⬇ Download MP4</button>
    
    <div class="timeline">
      <span id="curTime">0.00s</span>
      <input type="range" id="scrubber" min="0" max="32.0" step="0.01" value="0">
      <span id="totalTime">32.00s</span>
    </div>
  </div>

  <!-- Instagram Story Style 30s Audio Section Picker -->
  <div class="audio-picker-card">
    <div class="picker-header">
      <div class="song-meta">
        <span class="music-icon" style="font-size:14px;">🎵</span>
        <select id="songSelect" class="song-dropdown">
          <option value="berlioz" selected>berlioz — joycelyn's dance</option>
          <option value="dankye">Dan Kye — Actually</option>
          <option value="piano">Ater Felt Piano (Original)</option>
        </select>
      </div>
      <div class="picker-badge">
        <span>Section: <b id="windowTimeLabel">0:00 – 0:32</b></span>
        <button id="previewTrackBtn" class="pill-btn">Preview</button>
      </div>
    </div>

    <!-- Waveform & draggable 32s selection window -->
    <div class="waveform-container" id="waveformContainer">
      <div class="waveform-bars" id="waveformBars"></div>
      <div class="selection-window" id="selectionWindow">
        <div class="window-handle left"></div>
        <div class="window-time" id="windowCenterTime">0:00</div>
        <div class="window-handle right"></div>
      </div>
      <div class="playhead" id="waveformPlayhead"></div>
    </div>
    
    <div class="picker-instructions">
      <span>Drag or click to choose 30s cut</span>
      <span id="songFullDuration">3:18 total</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const muteBtn = document.getElementById('muteBtn');
    const switchBtn = document.getElementById('switchBtn');
    const scrubber = document.getElementById('scrubber');
    const curTimeLabel = document.getElementById('curTime');

    const DURATION = 32.0;
    let currentTime = 0;
    let isPlaying = true;
    let lastTimestamp = null;

    // --- ULTRA-SMOOTH CINEMATIC CAMERA MOTION (NO JITTER / BLINKING) ---
    function getGlobalPaperMotion(t = currentTime) {
      // Continuous smooth slow breathing camera drift
      const x = Math.sin(t * 0.45) * 1.8 + Math.sin(t * 0.95) * 0.8;
      const y = Math.cos(t * 0.38) * 1.6 + Math.sin(t * 0.82) * 0.7;
      const rot = Math.sin(t * 0.28) * 0.0010;

      return { x, y, rot };
    }

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    // Top Brand Header in top-left corner (matches website: ATER አጠር)
    function drawTopLogo(alpha = 1) {
      if (alpha <= 0.001) return;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.translate(90, 140);

      const engText = "ATER";
      const amhText = "አጠር";

      ctx.font = '900 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.letterSpacing = '-1.2px';
      ctx.fillStyle = '#18181b';
      ctx.fillText(engText, 0, 0);

      const engW = ctx.measureText(engText).width;
      const gap = 10;

      ctx.font = '900 36px "Noto Sans Ethiopic", "Kefa", sans-serif';
      ctx.letterSpacing = 'normal';
      ctx.fillStyle = 'rgba(24, 24, 27, 0.45)';
      ctx.fillText(amhText, engW + gap, 0);

      ctx.restore();
    }

    function getActTransition(t, start, end, crossfade = 0.8) {
      if (t < start || t > end) return { active: false, alpha: 0, y: 0 };
      const enterProg = easeOutCubic(Math.min(1, (t - start) / crossfade));
      const exitProg = t > (end - crossfade) ? easeInOutCubic((t - (end - crossfade)) / crossfade) : 0;
      const alpha = Math.max(0, Math.min(1, enterProg * (1 - exitProg)));
      const y = (1 - enterProg) * 22 - exitProg * 26;
      return { active: true, alpha, y };
    }

    // --- INSTAGRAM-STYLE 30-SECOND SECTION PICKER AUDIO ENGINE ---
    const songSelect = document.getElementById('songSelect');
    const previewTrackBtn = document.getElementById('previewTrackBtn');
    const windowTimeLabel = document.getElementById('windowTimeLabel');
    const windowCenterTime = document.getElementById('windowCenterTime');
    const songFullDuration = document.getElementById('songFullDuration');
    const waveformContainer = document.getElementById('waveformContainer');
    const waveformBars = document.getElementById('waveformBars');
    const selectionWindow = document.getElementById('selectionWindow');
    const waveformPlayhead = document.getElementById('waveformPlayhead');

    let songsData = {
      berlioz: { name: "berlioz — joycelyn's dance", file: "joycelyns_dance.mp3", duration: 198.5, peaks: [] },
      dankye: { name: "Dan Kye — Actually", file: "Dan_Kye_Actually.mp3", duration: 227.0, peaks: [] },
      piano: { name: "Ater Felt Piano (Original)", file: null, duration: 32.0, peaks: [] }
    };

    let activeSongKey = 'berlioz';
    let audioOffset = 0.0;
    const WINDOW_DURATION = 32.0;

    const audioPlayer = new Audio();
    audioPlayer.preload = 'auto';

    let audioCtx = null;
    let masterGain = null;
    let reverbGain = null;
    let isMuted = false;
    let lastScheduledIdx = -1;

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function updateWaveformUI() {
      const song = songsData[activeSongKey];
      if (!song || activeSongKey === 'piano') {
        waveformBars.innerHTML = '<div style="color:#888;font-size:11px;margin:auto;">Synthesized Web Audio Felt Piano (32.0s)</div>';
        selectionWindow.style.display = 'none';
        windowTimeLabel.textContent = '0:00 – 0:32 (Full)';
        songFullDuration.textContent = '32s synth';
        return;
      }

      selectionWindow.style.display = 'flex';
      songFullDuration.textContent = formatTime(song.duration) + ' total';

      waveformBars.innerHTML = '';
      const peaks = song.peaks && song.peaks.length ? song.peaks : new Array(120).fill(0.2);
      peaks.forEach(p => {
        const bar = document.createElement('div');
        bar.className = 'bar';
        const h = Math.max(3, Math.round(p * 42));
        bar.style.height = `${h}px`;
        waveformBars.appendChild(bar);
      });

      syncSelectionWindowUI();
    }

    function syncSelectionWindowUI() {
      const song = songsData[activeSongKey];
      if (!song || activeSongKey === 'piano') return;

      const containerWidth = waveformContainer.clientWidth || 390;
      const windowPct = Math.min(1, WINDOW_DURATION / song.duration);
      const windowWidthPx = Math.max(60, containerWidth * windowPct);
      
      const maxOffset = Math.max(0, song.duration - WINDOW_DURATION);
      audioOffset = Math.max(0, Math.min(audioOffset, maxOffset));

      const leftPx = (audioOffset / song.duration) * containerWidth;

      selectionWindow.style.width = `${windowWidthPx}px`;
      selectionWindow.style.left = `${leftPx}px`;

      const startTimeStr = formatTime(audioOffset);
      const endTimeStr = formatTime(audioOffset + WINDOW_DURATION);
      windowTimeLabel.textContent = `${startTimeStr} – ${endTimeStr}`;
      windowCenterTime.textContent = startTimeStr;

      const currentSongTime = audioOffset + currentTime;
      const playheadLeft = (currentSongTime / song.duration) * containerWidth;
      waveformPlayhead.style.left = `${playheadLeft}px`;
      waveformPlayhead.style.display = (activeSongKey !== 'piano') ? 'block' : 'none';
    }

    fetch('songs_data.json')
      .then(res => res.json())
      .then(data => {
        if (data.berlioz) songsData.berlioz = data.berlioz;
        if (data.dankye) songsData.dankye = data.dankye;
        updateWaveformUI();
      })
      .catch(() => updateWaveformUI());

    let isDraggingWindow = false;
    let startDragX = 0;
    let initialOffset = 0;

    function handleWaveformMove(clientX) {
      const song = songsData[activeSongKey];
      if (!song || activeSongKey === 'piano') return;
      const rect = waveformContainer.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const pct = Math.max(0, Math.min(1, clickX / rect.width));
      const targetTime = pct * song.duration;
      const maxOffset = Math.max(0, song.duration - WINDOW_DURATION);
      audioOffset = Math.max(0, Math.min(maxOffset, targetTime - WINDOW_DURATION / 2));
      syncSelectionWindowUI();

      if (isPlaying) {
        audioPlayer.currentTime = audioOffset + currentTime;
      }
    }

    waveformContainer.addEventListener('mousedown', (e) => {
      if (e.target.closest('#selectionWindow')) {
        isDraggingWindow = true;
        startDragX = e.clientX;
        initialOffset = audioOffset;
      } else {
        handleWaveformMove(e.clientX);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDraggingWindow) return;
      const song = songsData[activeSongKey];
      if (!song || activeSongKey === 'piano') return;

      const deltaX = e.clientX - startDragX;
      const rect = waveformContainer.getBoundingClientRect();
      const deltaSec = (deltaX / rect.width) * song.duration;
      const maxOffset = Math.max(0, song.duration - WINDOW_DURATION);

      audioOffset = Math.max(0, Math.min(maxOffset, initialOffset + deltaSec));
      syncSelectionWindowUI();

      if (isPlaying) {
        audioPlayer.currentTime = audioOffset + currentTime;
      }
    });

    window.addEventListener('mouseup', () => {
      isDraggingWindow = false;
    });

    waveformContainer.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      if (e.target.closest('#selectionWindow')) {
        isDraggingWindow = true;
        startDragX = touch.clientX;
        initialOffset = audioOffset;
      } else {
        handleWaveformMove(touch.clientX);
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isDraggingWindow) return;
      const touch = e.touches[0];
      const song = songsData[activeSongKey];
      if (!song || activeSongKey === 'piano') return;

      const deltaX = touch.clientX - startDragX;
      const rect = waveformContainer.getBoundingClientRect();
      const deltaSec = (deltaX / rect.width) * song.duration;
      const maxOffset = Math.max(0, song.duration - WINDOW_DURATION);

      audioOffset = Math.max(0, Math.min(maxOffset, initialOffset + deltaSec));
      syncSelectionWindowUI();
      if (isPlaying) {
        audioPlayer.currentTime = audioOffset + currentTime;
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      isDraggingWindow = false;
    });

    function setTrack(songKey) {
      activeSongKey = songKey;
      audioOffset = 0.0;
      if (activeSongKey === 'piano') {
        audioPlayer.pause();
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        lastScheduledIdx = pianoScore.findIndex(n => n.t >= currentTime) - 1;
      } else {
        const song = songsData[activeSongKey];
        audioPlayer.src = song.file;
        audioPlayer.currentTime = audioOffset + currentTime;
        audioPlayer.muted = isMuted;
        if (isPlaying) audioPlayer.play().catch(() => {});
      }
      updateWaveformUI();
    }

    songSelect.addEventListener('change', (e) => {
      setTrack(e.target.value);
    });

    previewTrackBtn.addEventListener('click', () => {
      currentTime = 0;
      isPlaying = true;
      playBtn.textContent = 'Pause';
      lastTimestamp = null;
      syncAudio(0, true);
    });

    audioPlayer.src = songsData.berlioz.file;

    function initAudio() {
      if (activeSongKey !== 'piano') {
        audioPlayer.muted = isMuted;
        return;
      }
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.38, audioCtx.currentTime);
      masterGain.connect(audioCtx.destination);

      const conv = audioCtx.createConvolver();
      const rate = audioCtx.sampleRate;
      const length = rate * 2.2;
      const impulse = audioCtx.createBuffer(2, length, rate);
      const impL = impulse.getChannelData(0);
      const impR = impulse.getChannelData(1);

      for (let i = 0; i < length; i++) {
        const decay = Math.exp(-i / (rate * 0.55));
        impL[i] = (Math.random() * 2 - 1) * decay;
        impR[i] = (Math.random() * 2 - 1) * decay;
      }
      conv.buffer = impulse;

      reverbGain = audioCtx.createGain();
      reverbGain.gain.setValueAtTime(0.28, audioCtx.currentTime);

      conv.connect(reverbGain);
      reverbGain.connect(masterGain);
    }


    function playFeltPiano(freq, time, duration = 3.6, velocity = 0.6) {
      if (!audioCtx || isMuted) return;

      const baseGain = audioCtx.createGain();
      baseGain.connect(masterGain);
      if (reverbGain) baseGain.connect(reverbGain);

      const osc1 = audioCtx.createOscillator();
      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(freq, time);

      const osc2 = audioCtx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(freq * 1.0008, time);

      const osc3 = audioCtx.createOscillator();
      const gain3 = audioCtx.createGain();
      osc3.type = 'sine';
      osc3.frequency.setValueAtTime(freq * 2, time);
      gain3.gain.setValueAtTime(0.18, time);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(850, time);
      filter.frequency.exponentialRampToValueAtTime(350, time + duration * 0.85);

      const hitGain = audioCtx.createGain();
      hitGain.gain.setValueAtTime(0.0001, time);
      hitGain.gain.linearRampToValueAtTime(velocity * 0.9, time + 0.024);
      hitGain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

      osc1.connect(filter);
      osc2.connect(filter);
      osc3.connect(gain3);
      gain3.connect(filter);
      filter.connect(hitGain);
      hitGain.connect(baseGain);

      osc1.start(time);
      osc2.start(time);
      osc3.start(time);

      osc1.stop(time + duration);
      osc2.stop(time + duration);
      osc3.stop(time + duration);
    }

    function playChord(freqs, time, dur = 4.0, vel = 0.5) {
      freqs.forEach((f, i) => {
        playFeltPiano(f, time + i * 0.018, dur, vel * (1 - i * 0.08));
      });
    }

    const pianoScore = [
      { t: 0.1,  fn: (ct) => playChord([130.81, 196.00, 261.63, 329.63], ct, 4.2, 0.6) },
      { t: 1.0,  fn: (ct) => playFeltPiano(392.00, ct, 2.8, 0.5) },
      { t: 1.85, fn: (ct) => playChord([110.00, 164.81, 220.00, 261.63], ct, 4.2, 0.65) },
      { t: 2.8,  fn: (ct) => playFeltPiano(329.63, ct, 3.2, 0.55) },
      { t: 4.2,  fn: (ct) => playFeltPiano(293.66, ct, 3.0, 0.5) },

      { t: 6.2,  fn: (ct) => playChord([87.31, 174.61, 261.63, 329.63], ct, 4.0, 0.6) },
      { t: 7.0,  fn: (ct) => playFeltPiano(392.00, ct, 2.5, 0.5) },
      { t: 8.0,  fn: (ct) => playChord([98.00, 196.00, 246.94, 293.66], ct, 4.2, 0.65) },
      { t: 8.8,  fn: (ct) => playFeltPiano(329.63, ct, 2.5, 0.55) },
      { t: 9.8,  fn: (ct) => playChord([110.00, 220.00, 261.63, 329.63], ct, 3.8, 0.6) },
      { t: 10.8, fn: (ct) => playFeltPiano(392.00, ct, 2.5, 0.5) },
      { t: 11.6, fn: (ct) => playFeltPiano(440.00, ct, 2.5, 0.55) },

      { t: 12.8, fn: (ct) => playChord([87.31, 174.61, 220.00, 261.63, 349.23], ct, 4.5, 0.7) },
      { t: 13.6, fn: (ct) => playFeltPiano(523.25, ct, 3.5, 0.65) },
      { t: 14.6, fn: (ct) => playChord([98.00, 196.00, 293.66, 392.00, 493.88], ct, 4.5, 0.75) },
      { t: 15.6, fn: (ct) => playFeltPiano(587.33, ct, 3.5, 0.65) },
      { t: 16.8, fn: (ct) => playChord([110.00, 220.00, 261.63, 329.63, 523.25], ct, 4.0, 0.7) },
      { t: 17.8, fn: (ct) => playFeltPiano(440.00, ct, 3.0, 0.6) },

      { t: 19.2, fn: (ct) => playChord([87.31, 174.61, 261.63, 349.23], ct, 4.5, 0.75) },
      { t: 20.0, fn: (ct) => playFeltPiano(392.00, ct, 2.5, 0.6) },
      { t: 20.8, fn: (ct) => playChord([98.00, 196.00, 293.66, 392.00], ct, 4.5, 0.8) },
      { t: 21.6, fn: (ct) => playFeltPiano(440.00, ct, 2.6, 0.65) },
      { t: 22.4, fn: (ct) => playFeltPiano(523.25, ct, 2.8, 0.7) },
      { t: 23.4, fn: (ct) => playFeltPiano(587.33, ct, 3.0, 0.75) },
      { t: 24.4, fn: (ct) => playFeltPiano(659.25, ct, 3.5, 0.8) },

      { t: 25.8, fn: (ct) => playChord([65.41, 130.81, 196.00, 261.63, 329.63, 523.25], ct, 6.2, 0.85) },
      { t: 27.2, fn: (ct) => playFeltPiano(392.00, ct, 4.5, 0.5) },
      { t: 28.5, fn: (ct) => playFeltPiano(523.25, ct, 5.0, 0.55) }
    ];

    function syncAudio(t, isRestart = false) {
      if (activeSongKey !== 'piano') {
        const targetSongTime = audioOffset + t;
        if (isRestart) {
          audioPlayer.currentTime = audioOffset;
          if (isPlaying && !isMuted) audioPlayer.play().catch(() => {});
        } else if (Math.abs(audioPlayer.currentTime - targetSongTime) > 0.35) {
          audioPlayer.currentTime = targetSongTime;
        }
        return;
      }

      if (!audioCtx) return;
      if (isRestart) {
        lastScheduledIdx = -1;
      }
      for (let i = 0; i < pianoScore.length; i++) {
        const ev = pianoScore[i];
        if (i > lastScheduledIdx && t >= ev.t && t < ev.t + 0.35) {
          ev.fn(audioCtx.currentTime);
          lastScheduledIdx = i;
        }
      }
    }

    // --- MAIN RENDER DISPATCHER (PORTRAIT 1080 x 1920) ---
    function render(t) {
      const W = canvas.width;
      const H = canvas.height;

      const motion = getGlobalPaperMotion(t);

      ctx.save();
      ctx.translate(W / 2 + motion.x, H / 2 + motion.y);
      ctx.rotate(motion.rot);
      ctx.translate(-W / 2, -H / 2);

      // Clean plain cream background
      ctx.fillStyle = '#fcf8f2';
      ctx.fillRect(-60, -60, W + 120, H + 120);

      // Top logo for vertical stories
      if (t < 25.6) {
        const logoAlpha = t > 24.6 ? 1 - easeInOutCubic((t - 24.6) / 1.0) : easeOutCubic(Math.min(1, t / 0.8));
        drawTopLogo(logoAlpha);
      }

      // =========================================================================
      // ACT 1: THE HOOK (0.0s – 6.4s)
      // "AI made studying feel effortless."
      // "Or did it just make pretending easy?"
      // =========================================================================
      {
        const act = getActTransition(t, 0.0, 6.4, 0.8);
        if (act.active) {
          ctx.save();
          ctx.globalAlpha = act.alpha;
          ctx.textAlign = 'center';

          // Beat 1: Elegant Single Line
          ctx.save();
          ctx.translate(W / 2, H * 0.45 + act.y);
          ctx.fillStyle = '#18181b';
          ctx.font = '58px "Newsreader", "Georgia", serif';
          ctx.letterSpacing = '-0.5px';
          ctx.fillText("AI made studying feel effortless.", 0, 0);
          ctx.restore();

          // Beat 2: Musical entry at 2.15s (joycelyns_dance piano downbeat)
          if (t >= 2.15) {
            const tProg = easeOutCubic(Math.min(1, (t - 2.15) / 0.85));
            ctx.save();
            ctx.globalAlpha = act.alpha * tProg;
            ctx.translate(W / 2, H * 0.45 + act.y + 110);
            ctx.font = 'italic 52px "Newsreader", "Georgia", serif';
            ctx.letterSpacing = '-0.5px';
            ctx.fillStyle = 'rgba(24, 24, 27, 0.48)';
            ctx.fillText("Or did it just make pretending easy?", 0, 0);
            ctx.restore();
          }

          ctx.textAlign = 'left';
          ctx.restore();
        }
      }

      // =========================================================================
      // ACT 2: THE TENSION (6.4s – 12.8s)
      // "You read the summary. You nodded along."
      // "Then someone asks you to explain it."
      // =========================================================================
      {
        const act = getActTransition(t, 6.4, 12.8, 0.8);
        if (act.active) {
          ctx.save();
          ctx.globalAlpha = act.alpha;
          ctx.textAlign = 'center';

          ctx.save();
          ctx.translate(W / 2, H * 0.45 + act.y);
          ctx.fillStyle = '#18181b';
          ctx.font = '56px "Newsreader", "Georgia", serif';
          ctx.letterSpacing = '-0.5px';
          ctx.fillText("You read the summary. You nodded along.", 0, 0);
          ctx.restore();

          // Beat 2: Musical entry aligned at 8.75s
          if (t >= 8.75) {
            const tProg = easeOutCubic(Math.min(1, (t - 8.75) / 0.85));
            ctx.save();
            ctx.globalAlpha = act.alpha * tProg;
            ctx.translate(W / 2, H * 0.45 + act.y + 110);
            ctx.font = 'italic 52px "Newsreader", "Georgia", serif';
            ctx.letterSpacing = '-0.5px';
            ctx.fillStyle = 'rgba(24, 24, 27, 0.48)';
            ctx.fillText("Then someone asks you to explain it.", 0, 0);
            ctx.restore();
          }

          ctx.textAlign = 'left';
          ctx.restore();
        }
      }

      // =========================================================================
      // ACT 3: THE TURNING POINT (12.8s – 19.2s)
      // "Big words hide empty thoughts."
      // "If you can't say it simply, you don't know it."
      // =========================================================================
      {
        const act = getActTransition(t, 12.8, 19.2, 0.8);
        if (act.active) {
          ctx.save();
          ctx.globalAlpha = act.alpha;
          ctx.textAlign = 'center';

          ctx.save();
          ctx.translate(W / 2, H * 0.45 + act.y);
          ctx.fillStyle = '#18181b';
          ctx.font = '62px "Newsreader", "Georgia", serif';
          ctx.letterSpacing = '-0.5px';
          ctx.fillText("Big words hide empty thoughts.", 0, 0);
          ctx.restore();

          if (t > 14.6) {
            const tProg = easeOutCubic(Math.min(1, (t - 14.6) / 0.9));
            ctx.save();
            ctx.globalAlpha = Math.min(act.alpha, tProg);
            ctx.translate(W / 2, H * 0.45 + act.y + 110);
            ctx.font = 'italic 46px "Newsreader", "Georgia", serif';
            ctx.fillStyle = 'rgba(24, 24, 27, 0.48)';
            ctx.fillText("If you can't say it simply, you don't know it.", 0, 0);
            ctx.restore();
          }

          ctx.textAlign = 'left';
          ctx.restore();
        }
      }

      // =========================================================================
      // ACT 4: THE CLIMAX & CHALLENGE (19.2s – 25.8s)
      // "Don't just collect notes."
      // "Say it out loud."
      // Centered acoustic waveform filaments
      // =========================================================================
      {
        const act = getActTransition(t, 19.2, 25.8, 0.8);
        if (act.active) {
          ctx.save();
          ctx.globalAlpha = act.alpha;
          ctx.textAlign = 'center';

          ctx.save();
          ctx.translate(W / 2, H * 0.43 + act.y);
          ctx.fillStyle = '#18181b';
          ctx.font = '62px "Newsreader", "Georgia", serif';
          ctx.letterSpacing = '-0.5px';
          ctx.fillText("Don't just collect notes.", 0, 0);
          ctx.restore();

          if (t > 20.8) {
            const tProg = easeOutCubic(Math.min(1, (t - 20.8) / 0.9));
            ctx.save();
            ctx.globalAlpha = Math.min(act.alpha, tProg);
            ctx.translate(W / 2, H * 0.43 + act.y + 110);

            ctx.font = 'italic 52px "Newsreader", "Georgia", serif';
            ctx.fillStyle = 'rgba(24, 24, 27, 0.48)';
            ctx.fillText("Say it out loud.", 0, 0);

            // Centered acoustic waveform
            const waveY = 85;
            const barCount = 36;
            const barSpacing = 16;
            const waveWidth = barCount * barSpacing;
            const waveStartX = -waveWidth / 2;

            ctx.lineWidth = 2.8;
            ctx.lineCap = 'round';

            for (let b = 0; b < barCount; b++) {
              const norm = b / (barCount - 1);
              const env = Math.sin(norm * Math.PI);
              const barH = (6 + Math.abs(Math.sin(t * 7.5 + b * 0.45)) * 36) * env;
              const bx = waveStartX + b * barSpacing;

              ctx.strokeStyle = '#18181b';
              ctx.beginPath();
              ctx.moveTo(bx, waveY - barH / 2);
              ctx.lineTo(bx, waveY + barH / 2);
              ctx.stroke();
            }

            ctx.restore();
          }

          ctx.textAlign = 'left';
          ctx.restore();
        }
      }

      // =========================================================================
      // ACT 5: THE RESOLUTION & LOGO (25.8s – 32.0s)
      // "ATER አጠር"
      // "Stop nodding. Start learning."
      // =========================================================================
      {
        const act = getActTransition(t, 25.8, 32.0, 1.0);
        if (act.active) {
          ctx.save();
          ctx.globalAlpha = act.alpha;
          ctx.translate(W / 2, H * 0.48 + act.y * 0.5);

          const engText = "ATER";
          const amhText = "አጠር";

          // Matching font size, tight authentic gap
          ctx.font = '900 110px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.letterSpacing = '-4px';
          const engW = ctx.measureText(engText).width;

          ctx.font = '900 110px "Noto Sans Ethiopic", "Kefa", sans-serif';
          ctx.letterSpacing = 'normal';
          const amhW = ctx.measureText(amhText).width;

          const gap = 16;
          const totalW = engW + gap + amhW;
          const startX = -totalW / 2;

          ctx.textAlign = 'left';
          ctx.font = '900 110px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.letterSpacing = '-4px';
          ctx.fillStyle = '#18181b';
          ctx.fillText(engText, startX, 0);

          ctx.font = '900 110px "Noto Sans Ethiopic", "Kefa", sans-serif';
          ctx.letterSpacing = 'normal';
          ctx.fillStyle = 'rgba(24, 24, 27, 0.45)';
          ctx.fillText(amhText, startX + engW + gap, 0);

          if (t > 26.8) {
            const tagProg = easeOutCubic(Math.min(1, (t - 26.8) / 0.9));
            ctx.save();
            ctx.globalAlpha = Math.min(act.alpha, tagProg);
            ctx.textAlign = 'center';
            ctx.font = 'italic 52px "Newsreader", "Georgia", serif';
            ctx.fillStyle = '#18181b';
            ctx.letterSpacing = '0.5px';
            ctx.fillText("Stop nodding. Start learning.", 0, 120);
            ctx.restore();
          }

          ctx.restore();
        }
      }

      ctx.restore();
    }

    // --- MAIN TICK LOOP ---
    function animate(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += dt;
        if (currentTime > DURATION) {
          currentTime = DURATION;
          isPlaying = false;
          playBtn.textContent = 'Play';
        }
        scrubber.value = currentTime;
        curTimeLabel.textContent = currentTime.toFixed(2) + 's';
        syncAudio(currentTime);
        if (activeSongKey !== 'piano') syncSelectionWindowUI();
      }

      render(currentTime);
      requestAnimationFrame(animate);
    }

    playBtn.addEventListener('click', () => {
      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? 'Pause' : 'Play';
      if (activeSongKey !== 'piano') {
        if (isPlaying) {
          audioPlayer.currentTime = audioOffset + currentTime;
          audioPlayer.play().catch(() => {});
        } else {
          audioPlayer.pause();
        }
      }
      if (isPlaying && currentTime >= DURATION) {
        currentTime = 0;
        syncAudio(0, true);
      }
      lastTimestamp = null;
    });

    restartBtn.addEventListener('click', () => {
      if (activeSongKey !== 'piano') {
        audioPlayer.currentTime = audioOffset;
        if (!isMuted) audioPlayer.play().catch(() => {});
      }
      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      currentTime = 0;
      isPlaying = true;
      playBtn.textContent = 'Pause';
      lastTimestamp = null;
      syncAudio(0, true);
    });

    if (switchBtn) {
      switchBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
      });
    }

    muteBtn.addEventListener('click', () => {
      initAudio();
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? 'Sound Off' : 'Sound On';
      audioPlayer.muted = isMuted;
      if (masterGain) {
        masterGain.gain.setValueAtTime(isMuted ? 0 : 0.38, audioCtx.currentTime);
      }
    });

    scrubber.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      if (activeSongKey !== 'piano') {
        audioPlayer.currentTime = audioOffset + currentTime;
        audioPlayer.pause();
      }
      initAudio();
      curTimeLabel.textContent = currentTime.toFixed(2) + 's';
      isPlaying = false;
      playBtn.textContent = 'Play';
      lastScheduledIdx = pianoScore.findIndex(n => n.t >= currentTime) - 1;
      syncSelectionWindowUI();
      render(currentTime);
    });

    window.addEventListener('click', () => {
      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }, { once: true });

    // --- VIDEO RECORDER / EXPORT LOGIC FOR 9:16 MOBILE ---
    const exportVideoBtn = document.getElementById('exportVideoBtn');
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];

    exportVideoBtn.addEventListener('click', async () => {
      if (isRecording) return;
      isRecording = true;
      exportVideoBtn.textContent = '⏳ Recording (0%)...';
      exportVideoBtn.style.background = '#e11d48';

      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

      currentTime = 0;
      isPlaying = false;
      syncAudio(0, true);

      const canvasStream = canvas.captureStream(60);

      let combinedStream = canvasStream;
      try {
        const destCtx = new (window.AudioContext || window.webkitAudioContext)();
        const destNode = destCtx.createMediaStreamDestination();

        if (activeSongKey !== 'piano') {
          const trackSource = destCtx.createMediaElementSource(audioPlayer);
          trackSource.connect(destNode);
          trackSource.connect(destCtx.destination);
        } else {
          masterGain.connect(destNode);
        }

        const audioTracks = destNode.stream.getAudioTracks();
        if (audioTracks.length > 0) {
          combinedStream = new MediaStream([...canvasStream.getVideoTracks(), audioTracks[0]]);
        }
      } catch (err) {
        console.warn("Direct audio routing fallback:", err);
      }

      const mimeTypes = [
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=h264',
        'video/webm;codecs=vp9',
        'video/webm'
      ];
      let selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || '';

      recordedChunks = [];
      mediaRecorder = new MediaRecorder(combinedStream, {
        mimeType: selectedMime,
        videoBitsPerSecond: 16000000 // 16 Mbps high quality
      });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const isMp4 = selectedMime.includes('mp4');
        const blob = new Blob(recordedChunks, { type: selectedMime || 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = isMp4 ? 'Ater_Teaser_Mobile_9x16.mp4' : 'Ater_Teaser_Mobile_9x16.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        isRecording = false;
        exportVideoBtn.textContent = '⬇ Download MP4';
        exportVideoBtn.style.background = '#18181b';
      };

      mediaRecorder.start();
      isPlaying = true;
      playBtn.textContent = 'Pause';
      lastTimestamp = null;
      syncAudio(0, true);

      const checkInterval = setInterval(() => {
        if (!isRecording) {
          clearInterval(checkInterval);
          return;
        }
        const pct = Math.round((currentTime / DURATION) * 100);
        exportVideoBtn.textContent = `⏳ (${pct}%)...`;

        if (currentTime >= DURATION) {
          clearInterval(checkInterval);
          mediaRecorder.stop();
          isPlaying = false;
          playBtn.textContent = 'Play';
        }
      }, 200);
    });

    requestAnimationFrame(animate);
  </script>
</body>
