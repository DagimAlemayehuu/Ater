<!DOCTYPE html><html class="dark" lang="en"><head>

                    "borderRadius": {

                    "spacing": {

<body class="bg-[#000000] text-on-surface min-h-screen flex flex-col selection:bg-primary-fixed selection:text-surface">
<header class="w-full border-b border-outline-variant">
<div class="w-full max-w-[1280px] px-[80px] h-[64px] flex items-center justify-center">
<a class="font-headline-md font-[900] tracking-tighter text-primary uppercase" href="#">ATER</a>
</div>
</header>
<div class="w-full max-w-[1280px] px-[80px] pt-[80px] pb-[80px] flex-1">
<main class="w-full max-w-[440px] flex flex-col gap-stack-lg relative items-center">
<!-- Back Action -->
<a aria-label="Go back" class="flex items-center gap-unit text-on-surface-variant hover:text-primary font-label-caps text-label-caps uppercase w-fit transition-none self-center" href="#">
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_back">arrow_back</span>
<span class="">BACK</span>
</a>
<!-- Header -->
<header class="flex flex-col gap-stack-sm text-center">
<h1 class="font-headline-lg text-headline-lg uppercase text-primary">JOIN WAITLIST</h1>
<p class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest">GET EARLY ACCESS.</p>
</header>
<!-- Registration Form -->
<form class="flex flex-col gap-stack-md">
<!-- Email Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase opacity-80" for="email">EMAIL</label>
<input class="w-full bg-[#000000] border border-outline-variant text-primary font-label-mono text-label-mono p-4 placeholder-on-surface-variant/50 focus:outline-none focus:border-primary-fixed transition-colors rounded-none appearance-none" id="email" placeholder="USER@ATER.AI" required="" type="email">
</div>
<!-- Full Name Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase opacity-80" for="fullName">FULL NAME</label>
<input class="w-full bg-[#000000] border border-outline-variant text-primary font-label-mono text-label-mono p-4 placeholder-on-surface-variant/50 focus:outline-none focus:border-primary-fixed transition-colors rounded-none appearance-none" id="fullName" placeholder="YOUR NAME" required="" type="text">
</div>
<!-- Password Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase opacity-80" for="password">PASSWORD</label>
<input class="w-full bg-[#000000] border border-outline-variant text-primary font-label-mono text-label-mono p-4 placeholder-on-surface-variant/50 focus:outline-none focus:border-primary-fixed transition-colors rounded-none appearance-none" id="password" placeholder="••••••••" required="" type="password">
</div>
<!-- Submit CTA -->
<button class="w-full mt-stack-sm bg-primary-container text-surface border border-outline-variant font-label-mono text-label-mono uppercase p-4 hover:bg-surface-tint transition-none flex justify-center items-center rounded-none" type="submit">
                JOIN WAITLIST
            </button>
</form>
<!-- Divider -->
<hr class="w-full border-t border-outline-variant my-stack-sm">
<!-- Footer Link -->
<div class="text-center font-label-caps text-label-caps text-on-surface-variant uppercase">
            REGISTERED? <a class="text-primary hover:underline transition-none ml-unit" href="#">SIGN IN</a>
</div>
</main>
</div>


</body></html>
